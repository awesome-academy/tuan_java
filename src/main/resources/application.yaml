spring:
  application:
    name: tripgo-api

  datasource:
    url: jdbc:mysql://localhost:3306/trip_go
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enable: true

  jpa:
    show-sql: true
    hibernate:
      format_sql: true
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT1H

logging:
  level.org.flywaydb: DEBUG
  level.org.springframework.boot.flyway: DEBUG

springdoc:
  swagger-ui:
    tagsSorter: alpha
