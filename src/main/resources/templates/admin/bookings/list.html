<!DOCTYPE html>
<html
        lang="vi"
        xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Quản lý Đơn đặt')}">
</head>

<body>

<div
        th:replace="~{admin/fragments/sidebar :: sidebar('bookings')}">
</div>

<main class="admin-main">

  <div
          th:replace="~{admin/fragments/topbar :: topbar('Quản lý Đơn đặt')}">
  </div>

  <div class="admin-content">

    <div
            th:replace="~{admin/fragments/messages :: messages}">
    </div>

    <!-- Filter -->

    <div class="booking-filter-tabs">

      <a
              th:href="@{/admin/bookings}"
              class="booking-filter-tab"
              th:classappend="${status == null} ? ' active'">
        Tất cả
      </a>

      <a
              th:href="@{/admin/bookings(status='PENDING')}"
              class="booking-filter-tab"
              th:classappend="${
                        status != null
                        and status.name() == 'PENDING'
                    } ? ' active'">
        Chờ xác nhận
      </a>

      <a
              th:href="@{/admin/bookings(status='CONFIRMED')}"
              class="booking-filter-tab"
              th:classappend="${
                        status != null
                        and status.name() == 'CONFIRMED'
                    } ? ' active'">
        Đã xác nhận
      </a>

      <a
              th:href="@{/admin/bookings(status='CANCELLED')}"
              class="booking-filter-tab"
              th:classappend="${
                        status != null
                        and status.name() == 'CANCELLED'
                    } ? ' active'">
        Đã hủy
      </a>

    </div>

    <!-- Table -->

    <div class="admin-table-wrapper">

      <table class="admin-table booking-table">

        <thead>

        <tr>
          <th>Mã đơn</th>
          <th>Khách</th>
          <th>Tour</th>
          <th>Ngày đi</th>
          <th>Số khách</th>
          <th>Tổng tiền</th>
          <th>Trạng thái</th>
        </tr>

        </thead>

        <tbody>

        <tr
                th:each="booking : ${result.content}">

          <td
                  class="fw-bold"
                  th:text="${booking.code}">
          </td>

          <td>

            <div
                    class="fw-semibold"
                    th:text="${booking.customerName}">
            </div>

            <div
                    class="small text-muted"
                    th:text="${booking.customerEmail}">
            </div>

          </td>

          <td>

            <div
                    th:text="${booking.tourTitle}">
            </div>

            <div
                    class="small text-muted"
                    th:text="${booking.tourSlug}">
            </div>

          </td>

          <td
                  th:text="${#temporals.format(
                                booking.departureDate,
                                'dd/MM/yyyy'
                            )}">
          </td>

          <td>

            <div
                    th:text="${booking.totalGuests + ' khách'}">
            </div>

            <div
                    class="small text-muted"
                    th:text="${
                                    booking.adults
                                    + ' NL, '
                                    + booking.children
                                    + ' TE'
                                }">
            </div>

          </td>

          <td
                  class="admin-price"
                  th:text="${
                                #numbers.formatDecimal(
                                    booking.totalPrice,
                                    0,
                                    'COMMA',
                                    0,
                                    'POINT'
                                )
                                + 'đ'
                            }">
          </td>

          <td>

            <!-- PENDING có thể đổi -->

            <form
                    th:if="${
                                    booking.status.name()
                                    == 'PENDING'
                                }"

                    th:action="@{
                                    /admin/bookings/{id}/status(
                                        id=${booking.id}
                                    )
                                }"

                    method="post">

              <select
                      name="status"
                      class="
                                        booking-status-select
                                        status-pending
                                    "
                      onchange="this.form.submit()">

                <option
                        value="PENDING"
                        selected
                        disabled>
                  Chờ xác nhận
                </option>

                <option
                        value="CONFIRMED">
                  Xác nhận
                </option>

                <option
                        value="CANCELLED">
                  Hủy đơn
                </option>

              </select>

            </form>

            <!-- CONFIRMED -->

            <span
                    th:if="${
                                    booking.status.name()
                                    == 'CONFIRMED'
                                }"

                    class="
                                    booking-status
                                    status-confirmed
                                ">
                            Đã xác nhận
                        </span>

            <!-- CANCELLED -->

            <span
                    th:if="${
                                    booking.status.name()
                                    == 'CANCELLED'
                                }"

                    class="
                                    booking-status
                                    status-cancelled
                                ">
                            Đã hủy
                        </span>

          </td>

        </tr>

        <tr th:if="${result.empty}">

          <td
                  colspan="7"
                  class="
                                text-center
                                text-muted
                                py-5
                            ">
            Không có đơn đặt phù hợp.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <!-- Pagination -->

    <nav
            class="admin-pagination"
            th:if="${result.totalPages > 1}">

      <!-- Previous -->

      <a
              th:if="${result.hasPrevious()}"

              th:href="@{/admin/bookings(
                        page=${result.number},
                        size=${result.size},
                        status=${status}
                    )}">

        <i class="bi bi-chevron-left">
        </i>

      </a>

      <!-- Pages -->

      <a
              th:each="p : ${
                        #numbers.sequence(
                            1,
                            result.totalPages
                        )
                    }"

              th:href="@{/admin/bookings(
                        page=${p},
                        size=${result.size},
                        status=${status}
                    )}"

              th:text="${p}"

              th:classappend="${
                        p == result.number + 1
                    } ? ' active'">
      </a>

      <!-- Next -->

      <a
              th:if="${result.hasNext()}"

              th:href="@{/admin/bookings(
                        page=${result.number + 2},
                        size=${result.size},
                        status=${status}
                    )}">

        <i class="bi bi-chevron-right">
        </i>

      </a>

    </nav>

  </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
