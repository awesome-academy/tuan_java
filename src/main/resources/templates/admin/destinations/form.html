<!DOCTYPE html>
<html
        lang="vi"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
            admin/fragments/head
            :: head(
                ${editMode}
                ? 'Sửa Điểm đến'
                : 'Thêm Điểm đến'
            )
        }">
</head>

<body>

<div
        th:replace="~{
            admin/fragments/sidebar
            :: sidebar('destinations')
        }">
</div>

<main class="admin-main">

  <div class="admin-content">

    <div class="admin-form-card">

      <h2
              th:text="${
                        editMode
                        ? 'Chỉnh sửa điểm đến'
                        : 'Thêm điểm đến'
                    }">
      </h2>

      <form
              th:object="${form}"

              th:action="${
                        editMode
                        ? '/admin/destinations/'
                            + destinationId
                        : '/admin/destinations'
                    }"

              method="post">

        <!-- Name -->

        <div class="mb-3">

          <label
                  for="name"
                  class="form-label">

            Tên điểm đến

          </label>

          <input
                  id="name"
                  type="text"
                  th:field="*{name}"
                  class="form-control"
                  th:classappend="${
                                #fields.hasErrors('name')
                            } ? ' is-invalid'">

          <div
                  class="invalid-feedback"
                  th:errors="*{name}">
          </div>

        </div>

        <!-- Slug -->

        <div class="mb-3">

          <label
                  for="slug"
                  class="form-label">

            Slug

          </label>

          <input
                  id="slug"
                  type="text"
                  th:field="*{slug}"
                  class="form-control"
                  placeholder="da-nang"
                  th:classappend="${
                                #fields.hasErrors('slug')
                            } ? ' is-invalid'">

          <div
                  class="invalid-feedback"
                  th:errors="*{slug}">
          </div>

        </div>

        <!-- Image -->

        <div class="mb-4">

          <label
                  for="imageUrl"
                  class="form-label">

            URL ảnh

          </label>

          <input
                  id="imageUrl"
                  type="text"
                  th:field="*{imageUrl}"
                  class="form-control"
                  placeholder="https://...">

          <div
                  class="invalid-feedback"
                  th:errors="*{imageUrl}">
          </div>

        </div>

        <div class="d-flex gap-2">

          <button
                  type="submit"
                  class="btn btn-admin-primary">

            <i class="bi bi-check-lg"></i>

            Lưu

          </button>

          <a
                  th:href="@{/admin/destinations}"
                  class="btn btn-outline-secondary">

            Hủy

          </a>

        </div>

      </form>

    </div>

  </div>

</main>

</body>
</html>
