<!DOCTYPE html>
<html
        lang="vi"
        xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head('Quản lý Tour')}">
</head>

<body>

<div
        th:replace="~{admin/fragments/sidebar :: sidebar('tours')}">
</div>

<main class="admin-main">

  <div
          th:replace="~{admin/fragments/topbar :: topbar('Quản lý Tour')}">
  </div>

  <div class="admin-content">

    <div
            th:replace="~{admin/fragments/messages :: messages}">
    </div>

    <div class="admin-toolbar">

      <form
              th:action="@{/admin/tours}"
              method="get"
              class="admin-search">

        <i class="bi bi-search"></i>

        <input
                type="text"
                name="q"
                th:value="${q}"
                placeholder="Tìm tour theo tên / điểm đến...">

      </form>

      <a
              th:href="@{/admin/tours/new}"
              class="btn admin-btn-primary">

        <i class="bi bi-plus-lg"></i>

        Thêm tour

      </a>

    </div>

    <div class="admin-table-wrapper">

      <table class="admin-table">

        <thead>

        <tr>

          <th>
            Tên tour
          </th>

          <th>
            Điểm đến
          </th>

          <th>
            Giá
          </th>

          <th>
            Thời lượng
          </th>

          <th>
            Đánh giá
          </th>

          <th>
            Thao tác
          </th>

        </tr>

        </thead>

        <tbody>

        <tr
                th:each="tour : ${result.content}">

          <td
                  class="fw-semibold"
                  th:text="${tour.title}">
          </td>

          <td
                  class="text-muted"
                  th:text="${tour.destination.name}">
          </td>

          <td
                  class="admin-price"
                  th:text="${#numbers.formatDecimal(
                                tour.discountPrice != null
                                    ? tour.discountPrice
                                    : tour.price,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            ) + 'đ'}">
          </td>

          <td
                  class="text-muted"
                  th:text="${tour.durationDays + ' ngày'}">
          </td>

          <td>

                        <span class="text-muted">
                            ★
                        </span>

            <span th:text="${tour.rating}">
                        </span>

          </td>

          <td>

            <div class="d-flex gap-2">

              <a
                      th:href="@{/admin/tours/{id}/edit(id=${tour.id})}"
                      class="btn admin-btn-edit">
                Sửa
              </a>

              <form
                      th:action="@{/admin/tours/{id}/delete(id=${tour.id})}"
                      method="post"
                      onsubmit="return confirmDeleteTour()">

                <button
                        type="submit"
                        class="btn admin-btn-delete">
                  Xóa
                </button>

              </form>

            </div>

          </td>

        </tr>

        <tr th:if="${result.empty}">

          <td
                  colspan="6"
                  class="text-center py-5 text-muted">
            Không tìm thấy tour.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <nav
            class="admin-pagination"
            th:if="${result.totalPages > 1}">

      <a
              th:each="p : ${#numbers.sequence(1, result.totalPages)}"

              th:href="@{/admin/tours(
                        page=${p},
                        size=${result.size},
                        q=${q}
                    )}"

              th:text="${p}"

              th:classappend="${p == result.number + 1} ? ' active'">

      </a>

    </nav>

  </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script th:src="@{/admin/js/admin.js}">
</script>

</body>
</html>
